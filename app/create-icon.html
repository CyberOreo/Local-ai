<!DOCTYPE html>
<html><body style="margin:0;background:#000">
<canvas id="c" width="64" height="64"></canvas>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const s = 64, r = 13;

// Rounded rect clip
ctx.beginPath();
ctx.moveTo(r,0); ctx.lineTo(s-r,0); ctx.quadraticCurveTo(s,0,s,r);
ctx.lineTo(s,s-r); ctx.quadraticCurveTo(s,s,s-r,s);
ctx.lineTo(r,s); ctx.quadraticCurveTo(0,s,0,s-r);
ctx.lineTo(0,r); ctx.quadraticCurveTo(0,0,r,0);
ctx.closePath();
ctx.save(); ctx.clip();

const grad = ctx.createLinearGradient(0,0,s,s);
grad.addColorStop(0,'#7c3aed'); grad.addColorStop(1,'#f59e0b');
ctx.fillStyle = grad; ctx.fillRect(0,0,s,s);

// Inner glow
const glow = ctx.createRadialGradient(20,20,0,20,20,40);
glow.addColorStop(0,'rgba(255,255,255,0.18)'); glow.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle = glow; ctx.fillRect(0,0,s,s);

ctx.font = 'bold 38px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillText('N', s/2+2, s/2+3);
ctx.fillStyle = '#ffffff'; ctx.fillText('N', s/2, s/2+1);
ctx.restore();

window.electronAPI.sendIcon(c.toDataURL('image/png'));
</script>
</body></html>
