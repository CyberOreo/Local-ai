<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { width:480px; height:300px; background:transparent; overflow:hidden;
  font-family:'Segoe UI',system-ui,sans-serif; }

.card {
  width:100%; height:100%;
  background:linear-gradient(135deg,#0d0d1a 0%,#13101f 100%);
  border:1px solid rgba(124,58,237,0.5);
  border-radius:18px;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; position:relative; overflow:hidden;
}

/* Top shimmer border */
.card::before {
  content:''; position:absolute; top:0; left:-100%; height:1px; width:200%;
  background:linear-gradient(90deg,transparent,rgba(245,158,11,.7),rgba(124,58,237,.7),transparent);
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer { to { left:100%; } }

/* Background orb */
.orb {
  position:absolute; width:260px; height:260px; border-radius:50%;
  background:radial-gradient(circle,rgba(124,58,237,0.18) 0%,transparent 70%);
  top:-80px; left:50%; transform:translateX(-50%);
  animation:orb 4s ease-in-out infinite;
}
@keyframes orb { 0%,100%{opacity:.5;transform:translateX(-50%) scale(1)} 50%{opacity:1;transform:translateX(-50%) scale(1.12)} }

.logo-row { display:flex; align-items:center; gap:16px; position:relative; z-index:1; }

.logo-n {
  width:58px; height:58px; border-radius:15px;
  background:linear-gradient(135deg,#7c3aed,#f59e0b);
  display:flex; align-items:center; justify-content:center;
  font-size:30px; font-weight:900; color:#fff;
  box-shadow:0 0 24px rgba(124,58,237,.65),0 0 48px rgba(124,58,237,.2);
  animation:logoGlow 2.5s ease-in-out infinite;
}
@keyframes logoGlow {
  0%,100%{box-shadow:0 0 24px rgba(124,58,237,.65),0 0 48px rgba(124,58,237,.2)}
  50%{box-shadow:0 0 32px rgba(245,158,11,.75),0 0 64px rgba(124,58,237,.3)}
}

.brand-name {
  font-size:28px; font-weight:800; line-height:1;
  background:linear-gradient(90deg,#c4b5fd,#f59e0b); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
}
.brand-tag { font-size:11px; color:rgba(255,255,255,.4); letter-spacing:2.5px; text-transform:uppercase; margin-top:4px; }

.status {
  font-size:13px; color:rgba(255,255,255,.55); min-height:18px;
  position:relative; z-index:1; transition:opacity .3s;
}

.bar-wrap {
  width:340px; height:3px; background:rgba(255,255,255,.07);
  border-radius:3px; overflow:visible; position:relative; z-index:1;
}
.bar-fill {
  height:100%; width:5%; border-radius:3px;
  background:linear-gradient(90deg,#7c3aed,#a855f7,#f59e0b);
  transition:width .7s cubic-bezier(.4,0,.2,1);
  position:relative;
}
.bar-fill::after {
  content:''; position:absolute; right:-4px; top:-4px;
  width:10px; height:10px; border-radius:50%;
  background:#f59e0b; box-shadow:0 0 10px #f59e0b,0 0 20px rgba(245,158,11,.4);
  transition:right .7s cubic-bezier(.4,0,.2,1);
}

.dots { display:flex; gap:5px; position:relative; z-index:1; }
.dot { width:5px; height:5px; border-radius:50%; background:rgba(124,58,237,.5);
  animation:dot 1.4s ease-in-out infinite; }
.dot:nth-child(2){animation-delay:.2s} .dot:nth-child(3){animation-delay:.4s}
@keyframes dot { 0%,80%,100%{transform:scale(.8);opacity:.4} 40%{transform:scale(1.2);opacity:1;background:#a78bfa} }
</style>
</head>
<body>
<div class="card">
  <div class="orb"></div>
  <div class="logo-row">
    <div class="logo-n">N</div>
    <div>
      <div class="brand-name">NeuralBox</div>
      <div class="brand-tag">Your Private AI Empire</div>
    </div>
  </div>
  <div class="status" id="msg">Initializing...</div>
  <div class="bar-wrap"><div class="bar-fill" id="bar"></div></div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
</div>
<script>
window.electronAPI.onStatus(({ msg, progress }) => {
  const m = document.getElementById('msg');
  m.style.opacity = '0';
  setTimeout(() => { m.textContent = msg; m.style.opacity = '1'; }, 150);
  document.getElementById('bar').style.width = Math.max(5, progress) + '%';
});
</script>
</body>
</html>
