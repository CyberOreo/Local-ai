<!DOCTYPE html>
<html>
<head>
<title>NeuralBox Profile Picture Generator</title>
<style>
  body{margin:0;background:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,sans-serif;color:#fff;gap:20px}
  canvas{border-radius:50%;box-shadow:0 0 80px rgba(124,58,237,.8)}
  button{padding:14px 32px;background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  button:hover{opacity:.9}
  p{color:#888;font-size:14px}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1080"></canvas>
<button onclick="download()">⬇ Save as PNG</button>
<p>Right-click canvas → Save image, or click the button above</p>
<script>
const c = document.getElementById('c');
const ctx = c.getContext('2d');
const W = 1080, H = 1080, CX = W/2, CY = H/2;

// Background
const bg = ctx.createRadialGradient(CX, CY-100, 0, CX, CY, 700);
bg.addColorStop(0, '#130d2e');
bg.addColorStop(0.5, '#09071a');
bg.addColorStop(1, '#04030c');
ctx.fillStyle = bg;
ctx.fillRect(0, 0, W, H);

// Aurora glow top-left
const g1 = ctx.createRadialGradient(200, 200, 0, 200, 200, 500);
g1.addColorStop(0, 'rgba(124,58,237,0.5)');
g1.addColorStop(1, 'transparent');
ctx.fillStyle = g1;
ctx.fillRect(0, 0, W, H);

// Aurora glow bottom-right
const g2 = ctx.createRadialGradient(900, 900, 0, 900, 900, 400);
g2.addColorStop(0, 'rgba(168,85,247,0.35)');
g2.addColorStop(1, 'transparent');
ctx.fillStyle = g2;
ctx.fillRect(0, 0, W, H);

// Gold accent glow
const g3 = ctx.createRadialGradient(CX, 300, 0, CX, 300, 350);
g3.addColorStop(0, 'rgba(245,158,11,0.18)');
g3.addColorStop(1, 'transparent');
ctx.fillStyle = g3;
ctx.fillRect(0, 0, W, H);

// Dot grid
ctx.fillStyle = 'rgba(124,58,237,0.08)';
for(let x=0;x<W;x+=36) for(let y=0;y<H;y+=36) {
  ctx.beginPath(); ctx.arc(x,y,1.5,0,Math.PI*2); ctx.fill();
}

// Outer ring — animated gradient look
const ringGrad = ctx.createConicalGradient
  ? ctx.createConicalGradient(0, CX, CY)
  : null;

// Draw multiple ring layers for glow effect
for(let i=4;i>=0;i--) {
  ctx.beginPath();
  ctx.arc(CX, CY, 460+i*6, 0, Math.PI*2);
  ctx.strokeStyle = `rgba(124,58,237,${0.06-i*0.01})`;
  ctx.lineWidth = 2;
  ctx.stroke();
}

// Main border ring
const borderGrad = ctx.createLinearGradient(0, 0, W, H);
borderGrad.addColorStop(0, '#7c3aed');
borderGrad.addColorStop(0.35, '#a855f7');
borderGrad.addColorStop(0.65, '#f59e0b');
borderGrad.addColorStop(1, '#7c3aed');
ctx.beginPath();
ctx.arc(CX, CY, 460, 0, Math.PI*2);
ctx.strokeStyle = borderGrad;
ctx.lineWidth = 8;
ctx.stroke();

// Inner glow ring
ctx.beginPath();
ctx.arc(CX, CY, 452, 0, Math.PI*2);
ctx.strokeStyle = 'rgba(168,85,247,0.4)';
ctx.lineWidth = 20;
ctx.stroke();

// Neural network nodes + connections
const nodes = [
  {x:CX, y:CY-180, r:8},
  {x:CX-160, y:CY-80, r:6},
  {x:CX+160, y:CY-80, r:6},
  {x:CX-240, y:CY+60, r:5},
  {x:CX, y:CY+40, r:7},
  {x:CX+240, y:CY+60, r:5},
  {x:CX-120, y:CY+200, r:6},
  {x:CX+120, y:CY+200, r:6},
  {x:CX-300, y:CY-180, r:4},
  {x:CX+300, y:CY-180, r:4},
  {x:CX, y:CY+320, r:5},
];

const connections = [
  [0,1],[0,2],[1,3],[2,5],[1,4],[2,4],[3,6],[5,7],[4,6],[4,7],[6,10],[7,10],[0,4],[3,4],[4,5],[0,8],[0,9]
];

// Draw connections
connections.forEach(([a,b]) => {
  const na = nodes[a], nb = nodes[b];
  const lineGrad = ctx.createLinearGradient(na.x, na.y, nb.x, nb.y);
  lineGrad.addColorStop(0, 'rgba(168,85,247,0.35)');
  lineGrad.addColorStop(0.5, 'rgba(245,158,11,0.2)');
  lineGrad.addColorStop(1, 'rgba(168,85,247,0.35)');
  ctx.beginPath();
  ctx.moveTo(na.x, na.y);
  ctx.lineTo(nb.x, nb.y);
  ctx.strokeStyle = lineGrad;
  ctx.lineWidth = 1.5;
  ctx.stroke();
});

// Draw node glows
nodes.forEach(n => {
  const ng = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r*5);
  ng.addColorStop(0, 'rgba(168,85,247,0.3)');
  ng.addColorStop(1, 'transparent');
  ctx.fillStyle = ng;
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.r*5, 0, Math.PI*2);
  ctx.fill();
});

// Draw nodes
nodes.forEach((n,i) => {
  ctx.beginPath();
  ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
  const ng = ctx.createRadialGradient(n.x-n.r*0.3, n.y-n.r*0.3, 0, n.x, n.y, n.r);
  ng.addColorStop(0, '#c084fc');
  ng.addColorStop(1, '#7c3aed');
  ctx.fillStyle = ng;
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();
});

// Central brain icon — large emoji render
ctx.save();
ctx.font = '220px serif';
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';
// Shadow glow
ctx.shadowColor = '#a855f7';
ctx.shadowBlur = 60;
ctx.fillText('🧠', CX, CY - 60);
ctx.shadowBlur = 0;
ctx.restore();

// NeuralBox text
ctx.save();
ctx.textAlign = 'center';
ctx.textBaseline = 'middle';

// "NEURAL" text
ctx.font = '900 88px Inter, Arial';
const textGrad = ctx.createLinearGradient(CX-200, 0, CX+200, 0);
textGrad.addColorStop(0, '#ffffff');
textGrad.addColorStop(0.5, '#c084fc');
textGrad.addColorStop(1, '#ffffff');
ctx.fillStyle = textGrad;
ctx.shadowColor = 'rgba(168,85,247,0.8)';
ctx.shadowBlur = 30;
ctx.fillText('NEURAL', CX, CY + 140);

// "BOX" text in gold
ctx.font = '900 88px Inter, Arial';
const goldGrad = ctx.createLinearGradient(CX-100, 0, CX+100, 0);
goldGrad.addColorStop(0, '#f59e0b');
goldGrad.addColorStop(0.5, '#fbbf24');
goldGrad.addColorStop(1, '#f59e0b');
ctx.fillStyle = goldGrad;
ctx.shadowColor = 'rgba(245,158,11,0.8)';
ctx.shadowBlur = 30;
ctx.fillText('BOX', CX, CY + 240);
ctx.shadowBlur = 0;

// Tagline
ctx.font = '400 32px Inter, Arial';
ctx.fillStyle = 'rgba(192,132,252,0.7)';
ctx.shadowBlur = 0;
ctx.fillText('private ai · free forever', CX, CY + 320);

ctx.restore();

// Shooting star accents
const stars = [{x:200,y:150,a:-0.5},{x:850,y:800,a:2.5},{x:750,y:200,a:-2.8}];
stars.forEach(s => {
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(s.a);
  const sg = ctx.createLinearGradient(-60, 0, 60, 0);
  sg.addColorStop(0, 'transparent');
  sg.addColorStop(0.5, 'rgba(255,255,255,0.5)');
  sg.addColorStop(1, 'transparent');
  ctx.strokeStyle = sg;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-60, 0);
  ctx.lineTo(60, 0);
  ctx.stroke();
  ctx.restore();
});

function download() {
  const a = document.createElement('a');
  a.download = 'NeuralBox-ProfilePic.png';
  a.href = c.toDataURL('image/png');
  a.click();
}

// Auto-trigger download after short delay
setTimeout(download, 800);
</script>
</body>
</html>
