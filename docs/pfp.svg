<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#160836"/>
      <stop offset="60%" stop-color="#08041a"/>
      <stop offset="100%" stop-color="#020108"/>
    </radialGradient>
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="40%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur8">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur20">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <filter id="blur40">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="circ">
      <circle cx="540" cy="540" r="530"/>
    </clipPath>
  </defs>

  <!-- BG -->
  <circle cx="540" cy="540" r="540" fill="url(#bg)"/>

  <!-- Background purple bloom -->
  <circle cx="420" cy="400" r="320" fill="#7c3aed" opacity="0.18" filter="url(#blur40)" clip-path="url(#circ)"/>
  <circle cx="680" cy="700" r="250" fill="#a855f7" opacity="0.12" filter="url(#blur40)" clip-path="url(#circ)"/>
  <circle cx="700" cy="320" r="180" fill="#f59e0b" opacity="0.08" filter="url(#blur40)" clip-path="url(#circ)"/>

  <!-- Grid lines subtle -->
  <g stroke="rgba(124,58,237,0.07)" stroke-width="1" clip-path="url(#circ)">
    <line x1="0" y1="270" x2="1080" y2="270"/>
    <line x1="0" y1="540" x2="1080" y2="540"/>
    <line x1="0" y1="810" x2="1080" y2="810"/>
    <line x1="270" y1="0" x2="270" y2="1080"/>
    <line x1="540" y1="0" x2="540" y2="1080"/>
    <line x1="810" y1="0" x2="810" y2="1080"/>
  </g>

  <!-- Neural dots background -->
  <g clip-path="url(#circ)">
    <!-- dots -->
    <circle cx="200" cy="250" r="3" fill="#7c3aed" opacity="0.5"/>
    <circle cx="380" cy="180" r="2.5" fill="#a855f7" opacity="0.4"/>
    <circle cx="760" cy="200" r="3" fill="#7c3aed" opacity="0.45"/>
    <circle cx="900" cy="320" r="2.5" fill="#f59e0b" opacity="0.3"/>
    <circle cx="160" cy="500" r="3" fill="#a855f7" opacity="0.4"/>
    <circle cx="920" cy="480" r="3" fill="#7c3aed" opacity="0.45"/>
    <circle cx="240" cy="780" r="2.5" fill="#a855f7" opacity="0.35"/>
    <circle cx="840" cy="820" r="3" fill="#7c3aed" opacity="0.4"/>
    <circle cx="480" cy="880" r="2.5" fill="#f59e0b" opacity="0.3"/>
    <circle cx="640" cy="900" r="2" fill="#a855f7" opacity="0.35"/>
    <!-- connection lines -->
    <line x1="200" y1="250" x2="380" y2="180" stroke="rgba(168,85,247,0.2)" stroke-width="1"/>
    <line x1="380" y1="180" x2="760" y2="200" stroke="rgba(168,85,247,0.15)" stroke-width="1"/>
    <line x1="760" y1="200" x2="900" y2="320" stroke="rgba(245,158,11,0.15)" stroke-width="1"/>
    <line x1="200" y1="250" x2="160" y2="500" stroke="rgba(168,85,247,0.18)" stroke-width="1"/>
    <line x1="900" y1="320" x2="920" y2="480" stroke="rgba(168,85,247,0.15)" stroke-width="1"/>
    <line x1="160" y1="500" x2="240" y2="780" stroke="rgba(168,85,247,0.15)" stroke-width="1"/>
    <line x1="920" y1="480" x2="840" y2="820" stroke="rgba(168,85,247,0.12)" stroke-width="1"/>
    <line x1="240" y1="780" x2="480" y2="880" stroke="rgba(168,85,247,0.15)" stroke-width="1"/>
    <line x1="840" y1="820" x2="640" y2="900" stroke="rgba(168,85,247,0.12)" stroke-width="1"/>
  </g>

  <!-- MAIN LOGO — stylized N shape using paths -->
  <!-- Glow layer -->
  <path d="M 310 220 L 310 720 L 390 720 L 540 390 L 540 720 L 620 720 L 620 560"
        stroke="#a855f7" stroke-width="90" stroke-linecap="round" stroke-linejoin="round" fill="none"
        opacity="0.25" filter="url(#blur20)" clip-path="url(#circ)"/>
  <path d="M 460 220 L 770 720 L 770 220"
        stroke="#f59e0b" stroke-width="90" stroke-linecap="round" stroke-linejoin="round" fill="none"
        opacity="0.2" filter="url(#blur20)" clip-path="url(#circ)"/>

  <!-- Actual N shape -->
  <path d="M 310 220 L 310 720 L 390 720 L 620 310 L 620 720 L 700 720 L 700 220 L 620 220 L 390 630 L 390 220 Z"
        fill="url(#mainGrad)" filter="url(#glow)" clip-path="url(#circ)"/>

  <!-- Accent dot top-right of N -->
  <circle cx="700" cy="220" r="22" fill="#fbbf24" filter="url(#glow)" clip-path="url(#circ)"/>
  <circle cx="310" cy="720" r="18" fill="#c084fc" filter="url(#glow)" clip-path="url(#circ)"/>

  <!-- Horizontal accent line -->
  <rect x="260" y="800" width="560" height="4" rx="2" fill="url(#lineGrad)" clip-path="url(#circ)"/>

  <!-- NEURALBOX wordmark -->
  <text x="540" y="900"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="68"
    font-weight="900"
    letter-spacing="10"
    text-anchor="middle"
    fill="white"
    opacity="0.85"
    clip-path="url(#circ)">NEURALBOX</text>

  <!-- Outer ring glow -->
  <circle cx="540" cy="540" r="518" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="25" filter="url(#blur8)"/>

  <!-- Outer ring sharp -->
  <circle cx="540" cy="540" r="522" fill="none" stroke="url(#ringGrad)" stroke-width="8"/>

  <!-- Small accent dots on ring -->
  <circle cx="540" cy="18" r="8" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="1062" cy="540" r="8" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="540" cy="1062" r="8" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="18" cy="540" r="8" fill="#f59e0b" filter="url(#glow)"/>
</svg>
