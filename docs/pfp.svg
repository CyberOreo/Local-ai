<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e0a4a"/>
      <stop offset="100%" stop-color="#04030c"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="540" cy="540" r="540" fill="url(#bg)"/>

  <!-- Purple center glow -->
  <circle cx="540" cy="540" r="380" fill="url(#purpleGlow)"/>

  <!-- Outer decorative rings -->
  <circle cx="540" cy="540" r="490" fill="none" stroke="rgba(124,58,237,0.15)" stroke-width="40"/>
  <circle cx="540" cy="540" r="505" fill="none" stroke="rgba(124,58,237,0.08)" stroke-width="20"/>

  <!-- Main border -->
  <circle cx="540" cy="540" r="510" fill="none" stroke="url(#ringGrad)" stroke-width="12"/>

  <!-- Corner dots on ring -->
  <circle cx="540" cy="30" r="10" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="1050" cy="540" r="10" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="540" cy="1050" r="10" fill="#a855f7" filter="url(#glow)"/>
  <circle cx="30" cy="540" r="10" fill="#f59e0b" filter="url(#glow)"/>

  <!-- BIG NB letters -->
  <!-- N -->
  <text x="280" y="560"
    font-family="Arial Black, Impact, sans-serif"
    font-weight="900"
    font-size="420"
    fill="url(#nGrad)"
    filter="url(#strongGlow)"
    dominant-baseline="middle"
    text-anchor="middle">N</text>

  <!-- B -->
  <text x="800" y="560"
    font-family="Arial Black, Impact, sans-serif"
    font-weight="900"
    font-size="420"
    fill="url(#bGrad)"
    filter="url(#strongGlow)"
    dominant-baseline="middle"
    text-anchor="middle">B</text>

  <!-- Bottom text -->
  <text x="540" y="860"
    font-family="Arial, sans-serif"
    font-weight="700"
    font-size="52"
    fill="rgba(255,255,255,0.5)"
    text-anchor="middle"
    letter-spacing="12">NEURALBOX</text>

  <!-- Top accent line -->
  <rect x="390" y="220" width="300" height="3" rx="2" fill="url(#ringGrad)" opacity="0.6"/>
</svg>
